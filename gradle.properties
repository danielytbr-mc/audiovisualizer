# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# build.gradle files instead.

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it easier to discover and migrate existing, old-style packages
android.useAndroidX=true

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and does not inherit a public dependency's R class.
# This property is useful if you want to make an AST, and do not want its dependencies to
# pollute the global namespace of you AST's R class.
android.nonTransitiveRClass=true

# Suppress deprecation warnings
org.gradle.warning.mode=none

# Line needed to shut up the compiler
android.suppressUnsupportedCompileSdk=34
